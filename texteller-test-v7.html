<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TexTeller — тест v7</title>
<style>
body{font-family:Arial,sans-serif;max-width:820px;margin:32px auto;padding:0 18px;line-height:1.45}
.note{background:#f5f5f5;padding:12px 14px;border-radius:10px;margin:12px 0 20px}
button,input{font-size:16px}
button{padding:9px 14px;cursor:pointer}
#preview{max-width:100%;max-height:360px;display:none;margin:18px 0;border:1px solid #ddd}
#status{margin:14px 0;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:14px;border-radius:10px;min-height:40px}
</style>
</head>
<body>
<h1>TexTeller — тест v7</h1>
<div class="note">Модель работает прямо в браузере. При первом запуске браузер скачает облегчённую ONNX-модель; это может занять некоторое время.</div>
<input id="file" type="file" accept="image/*">
<br><br>
<button id="run" disabled>Распознать формулу</button>
<img id="preview" alt="Предпросмотр">
<div id="status">Загрузка страницы…</div>
<h3>LaTeX</h3>
<pre id="result"></pre>

<script type="module">
import { pipeline, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.3';

const fileInput = document.getElementById('file');
const runButton = document.getElementById('run');
const status = document.getElementById('status');
const result = document.getElementById('result');
const preview = document.getElementById('preview');

let selectedFile = null;
let recognizerPromise = null;

async function getRecognizer() {
  if (!recognizerPromise) {
    status.textContent = 'Первый запуск: загружается облегчённая модель TexTeller…';
    recognizerPromise = pipeline('image-to-text', 'onnx-community/TexTeller3-ONNX', {
      device: 'wasm'
    });
  }
  return recognizerPromise;
}

fileInput.addEventListener('change', () => {
  selectedFile = fileInput.files?.[0] || null;
  runButton.disabled = !selectedFile;
  result.textContent = '';
  if (selectedFile) {
    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = 'block';
    status.textContent = 'Изображение выбрано. Нажмите «Распознать формулу».';
  }
});

runButton.addEventListener('click', async () => {
  if (!selectedFile) return;
  runButton.disabled = true;
  result.textContent = '';
  try {
    const recognizer = await getRecognizer();
    status.textContent = 'Распознавание…';
    // v7 diagnostic: split the uploaded image into two horizontal halves
    // and recognize each half independently. This removes automatic row detection
    // from the experiment so we can test TexTeller itself on one handwritten line.
    const bitmap = await createImageBitmap(selectedFile);

    const fullCanvas = document.createElement('canvas');
    fullCanvas.width = bitmap.width;
    fullCanvas.height = bitmap.height;
    const fullCtx = fullCanvas.getContext('2d', { willReadFrequently: true });
    fullCtx.drawImage(bitmap, 0, 0);
    bitmap.close();

    const W = fullCanvas.width;
    const H = fullCanvas.height;

    async function recognizeCrop(y0, y1, label) {
      const cropW = W;
      const cropH = y1 - y0;

      // Trim blank side margins using the dominant corner colour.
      const dataObj = fullCtx.getImageData(0, y0, W, cropH);
      const data = dataObj.data;

      function localPixel(x, y) {
        const i = (y * W + x) * 4;
        return [data[i], data[i + 1], data[i + 2]];
      }

      const corners = [
        localPixel(0, 0),
        localPixel(W - 1, 0),
        localPixel(0, cropH - 1),
        localPixel(W - 1, cropH - 1),
      ];

      const counts = new Map();
      for (const c of corners) {
        const key = c.join(',');
        counts.set(key, (counts.get(key) || 0) + 1);
      }

      let bg = corners[0];
      let best = -1;
      for (const [key, count] of counts.entries()) {
        if (count > best) {
          best = count;
          bg = key.split(',').map(Number);
        }
      }

      const threshold = 15;
      let minX = W, maxX = -1, minY = cropH, maxY = -1;

      for (let yy = 0; yy < cropH; yy++) {
        for (let x = 0; x < W; x++) {
          const i = (yy * W + x) * 4;
          const dr = Math.abs(data[i] - bg[0]);
          const dg = Math.abs(data[i + 1] - bg[1]);
          const db = Math.abs(data[i + 2] - bg[2]);
          const diffGray = 0.299 * dr + 0.587 * dg + 0.114 * db;

          if (diffGray > threshold) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (yy < minY) minY = yy;
            if (yy > maxY) maxY = yy;
          }
        }
      }

      if (maxX < minX || maxY < minY) {
        minX = 0; maxX = W - 1; minY = 0; maxY = cropH - 1;
      }

      const hPad = Math.max(8, Math.floor((maxX - minX + 1) * 0.03));
      const vPad = Math.max(4, Math.floor((maxY - minY + 1) * 0.18));

      minX = Math.max(0, minX - hPad);
      maxX = Math.min(W - 1, maxX + hPad);
      minY = Math.max(0, minY - vPad);
      maxY = Math.min(cropH - 1, maxY + vPad);

      const tightW = maxX - minX + 1;
      const tightH = maxY - minY + 1;

      // Match the same 447/448 scaling strategy used in v5.
      const shortSide = Math.min(tightW, tightH);
      const longSide = Math.max(tightW, tightH);
      let newShort = 447;
      let newLong = Math.round(447 * longSide / shortSide);

      if (newLong > 448) {
        newLong = 448;
        newShort = Math.round(448 * shortSide / longSide);
      }

      let outW, outH;
      if (tightW <= tightH) {
        outW = newShort;
        outH = newLong;
      } else {
        outW = newLong;
        outH = newShort;
      }

      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = 448;
      finalCanvas.height = 448;
      const finalCtx = finalCanvas.getContext('2d', { alpha: false });
      finalCtx.fillStyle = 'rgb(243,243,243)';
      finalCtx.fillRect(0, 0, 448, 448);
      finalCtx.imageSmoothingEnabled = true;
      finalCtx.imageSmoothingQuality = 'high';

      finalCtx.drawImage(
        fullCanvas,
        minX, y0 + minY, tightW, tightH,
        0, 0, outW, outH
      );

      const processedBlob = await new Promise((resolve, reject) => {
        finalCanvas.toBlob(
          b => b ? resolve(b) : reject(new Error('Could not create processed image')),
          'image/png'
        );
      });

      const image = await RawImage.fromBlob(processedBlob);
      image.grayscale();

      const out = await recognizer(image, {
        max_new_tokens: 1024,
        num_beams: 1,
        do_sample: false
      });

      const recognized = Array.isArray(out) && out.length
        ? (out[0].generated_text ?? out[0].text ?? JSON.stringify(out[0]))
        : JSON.stringify(out);

      return `${label}:\n${recognized}`;
    }

    const split = Math.floor(H / 2);
    const overlap = Math.max(4, Math.floor(H * 0.04));

    status.textContent = 'Распознаётся верхняя строка…';
    const top = await recognizeCrop(0, Math.min(H, split + overlap), 'Верхняя половина');

    status.textContent = 'Распознаётся нижняя строка…';
    const bottom = await recognizeCrop(Math.max(0, split - overlap), H, 'Нижняя половина');

    const output = [{ generated_text: `${top}\n\n${bottom}` }];
    const text = Array.isArray(output) && output.length
      ? (output[0].generated_text ?? output[0].text ?? JSON.stringify(output[0]))
      : JSON.stringify(output);
    result.textContent = text;
    status.textContent = 'Готово.';
  } catch (e) {
    console.error(e);
    status.textContent = 'Ошибка запуска/распознавания.';
    result.textContent = String(e?.message || e);
  } finally {
    runButton.disabled = !selectedFile;
  }
});

status.textContent = 'Выберите изображение формулы.';
</script>
</body>
</html>
