<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TexTeller — тест v5</title>
<style>
body{font-family:Arial,sans-serif;max-width:820px;margin:32px auto;padding:0 18px;line-height:1.45}
.note{background:#f5f5f5;padding:12px 14px;border-radius:10px;margin:12px 0 20px}
button,input{font-size:16px}
button{padding:9px 14px;cursor:pointer}
#preview{max-width:100%;max-height:360px;display:none;margin:18px 0;border:1px solid #ddd}
#status{margin:14px 0;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:14px;border-radius:10px;min-height:40px}
</style>
</head>
<body>
<h1>TexTeller — тест v5</h1>
<div class="note">Модель работает прямо в браузере. При первом запуске браузер скачает облегчённую ONNX-модель; это может занять некоторое время.</div>
<input id="file" type="file" accept="image/*">
<br><br>
<button id="run" disabled>Распознать формулу</button>
<img id="preview" alt="Предпросмотр">
<div id="status">Загрузка страницы…</div>
<h3>LaTeX</h3>
<pre id="result"></pre>

<script type="module">
import { pipeline, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.3';

const fileInput = document.getElementById('file');
const runButton = document.getElementById('run');
const status = document.getElementById('status');
const result = document.getElementById('result');
const preview = document.getElementById('preview');

let selectedFile = null;
let recognizerPromise = null;

async function getRecognizer() {
  if (!recognizerPromise) {
    status.textContent = 'Первый запуск: загружается облегчённая модель TexTeller…';
    recognizerPromise = pipeline('image-to-text', 'onnx-community/TexTeller3-ONNX', {
      device: 'wasm'
    });
  }
  return recognizerPromise;
}

fileInput.addEventListener('change', () => {
  selectedFile = fileInput.files?.[0] || null;
  runButton.disabled = !selectedFile;
  result.textContent = '';
  if (selectedFile) {
    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = 'block';
    status.textContent = 'Изображение выбрано. Нажмите «Распознать формулу».';
  }
});

runButton.addEventListener('click', async () => {
  if (!selectedFile) return;
  runButton.disabled = true;
  result.textContent = '';
  try {
    const recognizer = await getRecognizer();
    status.textContent = 'Распознавание…';
    // Preprocessing close to the official TexTeller pipeline:
    // 1) detect/crop background from corner colour,
    // 2) preserve aspect ratio,
    // 3) resize with bicubic interpolation,
    // 4) pad on the right/bottom to 448×448,
    // 5) convert to one grayscale channel.
    const bitmap = await createImageBitmap(selectedFile);

    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = bitmap.width;
    srcCanvas.height = bitmap.height;
    const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
    srcCtx.drawImage(bitmap, 0, 0);
    bitmap.close();

    const imgData = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
    const data = imgData.data;
    const W = srcCanvas.width;
    const H = srcCanvas.height;

    function pixelAt(x, y) {
      const i = (y * W + x) * 4;
      return [data[i], data[i + 1], data[i + 2]];
    }

    const corners = [
      pixelAt(0, 0),
      pixelAt(W - 1, 0),
      pixelAt(0, H - 1),
      pixelAt(W - 1, H - 1),
    ];

    // Same idea as TexTeller: use the most common corner colour as background.
    const counts = new Map();
    for (const c of corners) {
      const key = c.join(',');
      counts.set(key, (counts.get(key) || 0) + 1);
    }
    let bg = corners[0];
    let best = -1;
    for (const [key, count] of counts.entries()) {
      if (count > best) {
        best = count;
        bg = key.split(',').map(Number);
      }
    }

    // Equivalent in spirit to cv2.absdiff + grayscale + threshold 15.
    let minX = W, minY = H, maxX = -1, maxY = -1;
    const threshold = 15;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        const dr = Math.abs(data[i] - bg[0]);
        const dg = Math.abs(data[i + 1] - bg[1]);
        const db = Math.abs(data[i + 2] - bg[2]);
        const diffGray = 0.299 * dr + 0.587 * dg + 0.114 * db;
        if (diffGray > threshold) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    if (maxX < minX || maxY < minY) {
      minX = 0; minY = 0; maxX = W - 1; maxY = H - 1;
    }

    const cropW = maxX - minX + 1;
    const cropH = maxY - minY + 1;

    // Match torchvision Resize(size=447, max_size=448) as closely as possible.
    const shortSide = Math.min(cropW, cropH);
    const longSide = Math.max(cropW, cropH);
    let newShort = 447;
    let newLong = Math.round(447 * longSide / shortSide);

    if (newLong > 448) {
      newLong = 448;
      newShort = Math.round(448 * shortSide / longSide);
    }

    let outW, outH;
    if (cropW <= cropH) {
      outW = newShort;
      outH = newLong;
    } else {
      outW = newLong;
      outH = newShort;
    }

    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = 448;
    finalCanvas.height = 448;
    const finalCtx = finalCanvas.getContext('2d', { alpha: false });
    finalCtx.fillStyle = 'rgb(243,243,243)'; // IMAGE_MEAN≈0.9545, so this becomes ~0 after model normalization
    finalCtx.fillRect(0, 0, 448, 448);
    finalCtx.imageSmoothingEnabled = true;
    finalCtx.imageSmoothingQuality = 'high';
    finalCtx.drawImage(
      srcCanvas,
      minX, minY, cropW, cropH,
      0, 0, outW, outH
    );

    const processedBlob = await new Promise((resolve, reject) => {
      finalCanvas.toBlob(
        b => b ? resolve(b) : reject(new Error('Could not create processed image')),
        'image/png'
      );
    });

    const image = await RawImage.fromBlob(processedBlob);
    image.grayscale();

    const output = await recognizer(image, {
      max_new_tokens: 1024,
      num_beams: 1,
      do_sample: false
    });
    const text = Array.isArray(output) && output.length
      ? (output[0].generated_text ?? output[0].text ?? JSON.stringify(output[0]))
      : JSON.stringify(output);
    result.textContent = text;
    status.textContent = 'Готово.';
  } catch (e) {
    console.error(e);
    status.textContent = 'Ошибка запуска/распознавания.';
    result.textContent = String(e?.message || e);
  } finally {
    runButton.disabled = !selectedFile;
  }
});

status.textContent = 'Выберите изображение формулы.';
</script>
</body>
</html>
